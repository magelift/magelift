name: MageLift CI

# target: aws/ecs-fargate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [labeled, unlabeled, closed]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: string
      release_digest:
        description: Existing signed digest for production promotion
        type: string
      artifact_run_id:
        description: Successful source build run for production promotion
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "preview"
          - "production"
          - "staging"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v1.0.0-rc.1
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift --config 'magelift.php' providers install
      - name: Validate configuration
        run: magelift --config 'magelift.php' --no-interaction config validate
      - name: Resolve environment
        run: magelift --config 'magelift.php' --env "${{ matrix.environment }}" --no-interaction --output json config effective > /dev/null

  build:
    name: Build and sign immutable image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment != 'production')) || (github.event_name == 'pull_request_target' && github.ref == 'refs/heads/main' && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'magelift-preview' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request_target' && 'preview-build' || 'build' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out shop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: shop
      - name: Check out trusted build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: project
      - name: Verify source identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test "$(git -C shop rev-parse HEAD)" = "$SOURCE_SHA"
          test -f shop/composer.lock
          test ! -L shop/composer.lock
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.10.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v1.0.0-rc.1
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.MAGELIFT_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate registry destination
        env:
          IMAGE: ${{ vars.MAGELIFT_RELEASE_IMAGE }}
          REGISTRY: ${{ vars.MAGELIFT_REGISTRY }}
        run: |
          set -eu
          test -n "$IMAGE"
          test -n "$REGISTRY"
          test "${IMAGE%%/*}" = "$REGISTRY"
      - name: Authenticate user GHCR repository
        if: vars.MAGELIFT_REGISTRY == 'ghcr.io'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate generic registry credentials
        if: vars.MAGELIFT_REGISTRY != 'ghcr.io'
        env:
          USERNAME: ${{ vars.MAGELIFT_REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.MAGELIFT_REGISTRY_PASSWORD }}
        run: |
          test -n "$USERNAME"
          test -n "$PASSWORD"
      - name: Authenticate user registry
        if: vars.MAGELIFT_REGISTRY != 'ghcr.io'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.MAGELIFT_REGISTRY }}
          username: ${{ vars.MAGELIFT_REGISTRY_USERNAME }}
          password: ${{ secrets.MAGELIFT_REGISTRY_PASSWORD }}
      - name: Build and sign image
        id: build
        env:
          MAGELIFT_RELEASE_IMAGE: ${{ vars.MAGELIFT_RELEASE_IMAGE }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPOSER_AUTH: ${{ secrets.MAGELIFT_COMPOSER_AUTH }}
        run: |
          set -eu
          test -n "$MAGELIFT_RELEASE_IMAGE"
          image="$MAGELIFT_RELEASE_IMAGE"
          case "${image##*/}" in
            *:*) ;;
            *)
              printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
              image="$image:$SOURCE_SHA"
              ;;
          esac
          build_dir="$RUNNER_TEMP/magelift-build"
          result="$build_dir/build-result.json"
          mkdir -p "$build_dir"
          magelift --config 'project/magelift.php' --no-interaction --output json build --push --source shop \
            --image "$image" > "$result"
          digest="$(jq -er '.image | (.imageReference | sub(":[^/:]+$"; "")) + "@" + .digest' "$result")"
          cp -- "$(jq -er '.manifest' "$result")" "$build_dir/manifest.json"
          checksum="$(jq -er '.manifestSha256 | select(test("^[a-f0-9]{64}$"))' "$result")"
          printf '%s  manifest.json\n' "$checksum" > "$build_dir/manifest.sha256"
          (cd "$build_dir" && sha256sum -c manifest.sha256)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Retain existing artifact manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magelift-build-${{ github.run_id }}
          path: ${{ runner.temp }}/magelift-build/
          if-no-files-found: error
          retention-days: 14

  preview:
    name: Preview infrastructure
    if: github.event_name == 'pull_request_target' && github.ref == 'refs/heads/main' && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'magelift-preview' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: magelift-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Install Pulumi CLI
        run: |
          set -eu
          version=v3.277.0
          case "$(uname -m)" in
            x86_64) arch=x64; checksum=1e38f0fb69a14a326cf3acfaf975770e8de5d0771042f26292f0013d237b8393 ;;
            aarch64|arm64) arch=arm64; checksum=b9c2708bd13ffdcba79f555a0532893a9b5a44efca8e225d171b8f7b605b16ce ;;
            *) echo "Unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$(mktemp -d "$RUNNER_TEMP/magelift-pulumi.XXXXXX")"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/pulumi/pulumi/releases/download/$version/pulumi-$version-linux-$arch.tar.gz" -o pulumi.tar.gz
          printf '%s  pulumi.tar.gz\n' "$checksum" | sha256sum --check -
          tar -xzf pulumi.tar.gz pulumi/pulumi
          printf '%s\n' "$install_dir/pulumi" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v1.0.0-rc.1
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift --config 'magelift.php' providers install
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.MAGELIFT_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate environment variable
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_PREVIEW_ENV }}
        run: test -n "$DEPLOY_ENV"
      - name: Download existing artifact manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: magelift-build-${{ github.run_id }}
          path: ${{ runner.temp }}/magelift-build/
      - name: Verify artifact handoff
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        working-directory: ${{ runner.temp }}/magelift-build/
        run: |
          set -eu
          sha256sum -c manifest.sha256
          test "$(jq -er '.image | (.imageReference | sub(":[^/:]+$"; "")) + "@" + .digest' build-result.json)" = "$DIGEST"
          test "$(jq -er '.imageDigest' manifest.json)" = "${DIGEST##*@}"
      - name: Preview selected environment
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          PREVIEW_CHANGED_AT: ${{ github.event.pull_request.updated_at }}
          PREVIEW_ENV: ${{ vars.MAGELIFT_PREVIEW_ENV }}
          PREVIEW_REPOSITORY: ${{ github.repository }}
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
          PREVIEW_GENERATION: ${{ github.run_id }}
        run: |
          set -eu
          test -n "$PREVIEW_ENV"
          test -n "$PREVIEW_REPOSITORY"
          test -n "$PREVIEW_NUMBER"
          test -n "$PREVIEW_COMMIT"
          magelift --config 'magelift.php' --env "$PREVIEW_ENV" --preview-repository "$PREVIEW_REPOSITORY" --preview-number "$PREVIEW_NUMBER" --preview-branch "$PREVIEW_BRANCH" --preview-commit "$PREVIEW_COMMIT" --preview-generation "$PREVIEW_GENERATION" --preview-updated-at "$PREVIEW_CHANGED_AT" --no-interaction --yes deploy --digest "$DIGEST"

  preview-destroy:
    name: Remove preview
    if: github.event_name == 'pull_request_target' && github.ref == 'refs/heads/main' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'magelift-preview')) || (github.event.action == 'unlabeled' && github.event.label.name == 'magelift-preview'))
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: magelift-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Install Pulumi CLI
        run: |
          set -eu
          version=v3.277.0
          case "$(uname -m)" in
            x86_64) arch=x64; checksum=1e38f0fb69a14a326cf3acfaf975770e8de5d0771042f26292f0013d237b8393 ;;
            aarch64|arm64) arch=arm64; checksum=b9c2708bd13ffdcba79f555a0532893a9b5a44efca8e225d171b8f7b605b16ce ;;
            *) echo "Unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$(mktemp -d "$RUNNER_TEMP/magelift-pulumi.XXXXXX")"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/pulumi/pulumi/releases/download/$version/pulumi-$version-linux-$arch.tar.gz" -o pulumi.tar.gz
          printf '%s  pulumi.tar.gz\n' "$checksum" | sha256sum --check -
          tar -xzf pulumi.tar.gz pulumi/pulumi
          printf '%s\n' "$install_dir/pulumi" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v1.0.0-rc.1
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift --config 'magelift.php' providers install
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.MAGELIFT_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate environment variable
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_PREVIEW_ENV }}
        run: test -n "$DEPLOY_ENV"
      - name: Destroy preview environment
        env:
          PREVIEW_ENV: ${{ vars.MAGELIFT_PREVIEW_ENV }}
          PREVIEW_REPOSITORY: ${{ github.repository }}
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
          PREVIEW_GENERATION: ${{ github.run_id }}
        run: |
          set -eu
          test -n "$PREVIEW_ENV"
          test -n "$PREVIEW_REPOSITORY"
          test -n "$PREVIEW_NUMBER"
          test -n "$PREVIEW_COMMIT"
          magelift --config 'magelift.php' --env "$PREVIEW_ENV" --preview-repository "$PREVIEW_REPOSITORY" --preview-number "$PREVIEW_NUMBER" --preview-branch "$PREVIEW_BRANCH" --preview-commit "$PREVIEW_COMMIT" --preview-generation "$PREVIEW_GENERATION" --no-interaction --yes destroy

  preview-sweep:
    name: Sweep expired previews
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Install Pulumi CLI
        run: |
          set -eu
          version=v3.277.0
          case "$(uname -m)" in
            x86_64) arch=x64; checksum=1e38f0fb69a14a326cf3acfaf975770e8de5d0771042f26292f0013d237b8393 ;;
            aarch64|arm64) arch=arm64; checksum=b9c2708bd13ffdcba79f555a0532893a9b5a44efca8e225d171b8f7b605b16ce ;;
            *) echo "Unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$(mktemp -d "$RUNNER_TEMP/magelift-pulumi.XXXXXX")"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/pulumi/pulumi/releases/download/$version/pulumi-$version-linux-$arch.tar.gz" -o pulumi.tar.gz
          printf '%s  pulumi.tar.gz\n' "$checksum" | sha256sum --check -
          tar -xzf pulumi.tar.gz pulumi/pulumi
          printf '%s\n' "$install_dir/pulumi" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v1.0.0-rc.1
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift --config 'magelift.php' providers install
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.MAGELIFT_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Destroy expired previews
        run: |
          test -n "${{ vars.MAGELIFT_PREVIEW_ENV }}"
          magelift --config 'magelift.php' --env "${{ vars.MAGELIFT_PREVIEW_ENV }}" --preview-repository "${{ github.repository }}" --no-interaction --yes env sweep

  staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) && needs.build.result == 'success'
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Install Pulumi CLI
        run: |
          set -eu
          version=v3.277.0
          case "$(uname -m)" in
            x86_64) arch=x64; checksum=1e38f0fb69a14a326cf3acfaf975770e8de5d0771042f26292f0013d237b8393 ;;
            aarch64|arm64) arch=arm64; checksum=b9c2708bd13ffdcba79f555a0532893a9b5a44efca8e225d171b8f7b605b16ce ;;
            *) echo "Unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$(mktemp -d "$RUNNER_TEMP/magelift-pulumi.XXXXXX")"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/pulumi/pulumi/releases/download/$version/pulumi-$version-linux-$arch.tar.gz" -o pulumi.tar.gz
          printf '%s  pulumi.tar.gz\n' "$checksum" | sha256sum --check -
          tar -xzf pulumi.tar.gz pulumi/pulumi
          printf '%s\n' "$install_dir/pulumi" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v1.0.0-rc.1
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift --config 'magelift.php' providers install
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.MAGELIFT_STAGING_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate environment variable
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_STAGING_ENV }}
        run: test -n "$DEPLOY_ENV"
      - name: Download existing artifact manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: magelift-build-${{ github.run_id }}
          path: ${{ runner.temp }}/magelift-build/
      - name: Verify artifact handoff
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        working-directory: ${{ runner.temp }}/magelift-build/
        run: |
          set -eu
          sha256sum -c manifest.sha256
          test "$(jq -er '.image | (.imageReference | sub(":[^/:]+$"; "")) + "@" + .digest' build-result.json)" = "$DIGEST"
          test "$(jq -er '.imageDigest' manifest.json)" = "${DIGEST##*@}"
      - name: Deploy immutable digest
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_STAGING_ENV }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          test "$DEPLOY_ENV" = staging
          magelift --config 'magelift.php' --env "$DEPLOY_ENV" --no-interaction --yes deploy --digest "$DIGEST"

  production:
    name: Promote and deploy production
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Install Pulumi CLI
        run: |
          set -eu
          version=v3.277.0
          case "$(uname -m)" in
            x86_64) arch=x64; checksum=1e38f0fb69a14a326cf3acfaf975770e8de5d0771042f26292f0013d237b8393 ;;
            aarch64|arm64) arch=arm64; checksum=b9c2708bd13ffdcba79f555a0532893a9b5a44efca8e225d171b8f7b605b16ce ;;
            *) echo "Unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$(mktemp -d "$RUNNER_TEMP/magelift-pulumi.XXXXXX")"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/pulumi/pulumi/releases/download/$version/pulumi-$version-linux-$arch.tar.gz" -o pulumi.tar.gz
          printf '%s  pulumi.tar.gz\n' "$checksum" | sha256sum --check -
          tar -xzf pulumi.tar.gz pulumi/pulumi
          printf '%s\n' "$install_dir/pulumi" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v1.0.0-rc.1
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift --config 'magelift.php' providers install
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.MAGELIFT_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate environment variable
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_PRODUCTION_ENV }}
        run: test -n "$DEPLOY_ENV"
      - name: Require an existing release
        env:
          DIGEST: ${{ inputs.release_digest }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          test -n "$DIGEST"
          test -n "$ARTIFACT_RUN_ID"
          case "$ARTIFACT_RUN_ID" in *[!0-9]*) exit 1 ;; esac
          workflow_path="${WORKFLOW_REF#"$REPOSITORY"/}"
          workflow_path="${workflow_path%@*}"
          gh api "repos/$REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > "$RUNNER_TEMP/magelift-source-run.json"
          jq -e --arg repo "$REPOSITORY" --arg path "$workflow_path" '.conclusion == "success" and .head_branch == "main" and .head_repository.full_name == $repo and .path == $path and (.event == "push" or .event == "workflow_dispatch")' "$RUNNER_TEMP/magelift-source-run.json" > /dev/null
      - name: Download existing artifact manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: magelift-build-${{ inputs.artifact_run_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/magelift-build/
      - name: Verify artifact handoff
        env:
          DIGEST: ${{ inputs.release_digest }}
        working-directory: ${{ runner.temp }}/magelift-build/
        run: |
          set -eu
          sha256sum -c manifest.sha256
          test "$(jq -er '.image | (.imageReference | sub(":[^/:]+$"; "")) + "@" + .digest' build-result.json)" = "$DIGEST"
          test "$(jq -er '.imageDigest' manifest.json)" = "${DIGEST##*@}"
      - name: Verify and promote digest
        env:
          DIGEST: ${{ inputs.release_digest }}
          SIGNING_IDENTITY: ${{ vars.MAGELIFT_IMAGE_SIGNING_IDENTITY }}
          SIGNING_ISSUER: ${{ vars.MAGELIFT_IMAGE_SIGNING_ISSUER }}
        run: |
          test -n "$SIGNING_IDENTITY"
          test -n "$SIGNING_ISSUER"
          magelift --config 'magelift.php' --env production --no-interaction --yes promote \
            --digest "$DIGEST" \
            --from staging \
            --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer "$SIGNING_ISSUER"
      - name: Deploy promoted digest
        env:
          DIGEST: ${{ inputs.release_digest }}
        run: magelift --config 'magelift.php' --env production --no-interaction --yes deploy --digest "$DIGEST"
