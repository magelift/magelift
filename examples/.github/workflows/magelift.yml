name: MageLift CI

# target: aws/ecs-fargate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "production"
          - "staging"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install MageLift
        run: go install github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Validate configuration
        run: magelift --config 'magelift.yaml' --no-interaction config validate
      - name: Resolve environment
        run: magelift --config 'magelift.yaml' --env "${{ matrix.environment }}" --no-interaction --output json config effective > /dev/null

  build:
    name: Build and sign immutable image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.MAGELIFT_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Install MageLift
        run: go install -ldflags="-X github.com/magelift/magelift/internal/cli.Version=v1.0.0-rc.1" github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Build and sign image
        id: build
        env:
          MAGELIFT_RELEASE_IMAGE: ${{ vars.MAGELIFT_RELEASE_IMAGE }}
          MAGELIFT_BUILDER_IMAGE: ${{ vars.MAGELIFT_BUILDER_IMAGE }}
          MAGELIFT_RUNTIME_IMAGE: ${{ vars.MAGELIFT_RUNTIME_IMAGE }}
        run: |
          set -eu
          for required in MAGELIFT_RELEASE_IMAGE MAGELIFT_BUILDER_IMAGE MAGELIFT_RUNTIME_IMAGE; do
            test -n "${!required}"
          done
          magelift --config 'magelift.yaml' --no-interaction --output json build --push \
            --image "$MAGELIFT_RELEASE_IMAGE" \
            --builder-image "$MAGELIFT_BUILDER_IMAGE" \
            --runtime-image "$MAGELIFT_RUNTIME_IMAGE" > build-result.json
          digest="$(jq -er '.image.imageReference + "@" + .image.digest' build-result.json)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  staging:
    name: Deploy staging
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) && needs.build.result == 'success'
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install MageLift
        run: go install -ldflags="-X github.com/magelift/magelift/internal/cli.Version=v1.0.0-rc.1" github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.MAGELIFT_STAGING_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate environment variable
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_STAGING_ENV }}
        run: test -n "$DEPLOY_ENV"
      - name: Deploy immutable digest
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_STAGING_ENV }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          test "$DEPLOY_ENV" = staging
          magelift --config 'magelift.yaml' --env "$DEPLOY_ENV" --no-interaction --yes deploy --digest "$DIGEST"

  production:
    name: Promote and deploy production
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && needs.build.result == 'success'
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install MageLift
        run: go install -ldflags="-X github.com/magelift/magelift/internal/cli.Version=v1.0.0-rc.1" github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.MAGELIFT_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate environment variable
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_PRODUCTION_ENV }}
        run: test -n "$DEPLOY_ENV"
      - name: Verify and promote digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          magelift --config 'magelift.yaml' --env production --no-interaction --yes promote \
            --digest "$DIGEST" \
            --from staging
      - name: Deploy promoted digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: magelift --config 'magelift.yaml' --env production --no-interaction --yes deploy --digest "$DIGEST"
