version: "2"

run:
  concurrency: 4
  timeout: 15m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - misspell
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1005"
        - "-QF1001"
        - "-QF1008"
        - "-S1002"
        - "-SA1019"
  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
