# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# Local packaging smoke: use scripts/release-smoke-local.sh or make release-smoke
# (dialproof config, host only). Full multi-platform matrices belong on CI.
# Cap Go with GOMEMLIMIT from scripts/go-memlimit.sh; do not pin
# GOMAXPROCS. Hosted release.yml passes --parallelism 1 so the
# full platform matrix runs one compile at a time.

project_name: magelift

builds:
  - id: magelift
    main: ./cmd/magelift
    binary: magelift
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X github.com/magelift/magelift/internal/cli.Version={{ .Version }}
  # Each provider has a standalone binary with the same platform matrix as
  # the CLI. The binary reports its version through main.Version.
  - id: magelift-provider-aws
    dir: providers/aws
    main: ./cmd/magelift-provider-aws
    binary: magelift-provider-aws
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X main.Version={{ .Version }}
  - id: magelift-provider-gcp
    dir: providers/gcp
    main: ./cmd/magelift-provider-gcp
    binary: magelift-provider-gcp
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X main.Version={{ .Version }}
  - id: magelift-provider-azure
    dir: providers/azure
    main: ./cmd/magelift-provider-azure
    binary: magelift-provider-azure
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X main.Version={{ .Version }}

archives:
  - id: provider-aws
    ids: [magelift-provider-aws]
    formats: [binary]
  - id: cli
    ids: [magelift]
    formats: [tar.gz]
    # Scoop convention is zip; tar.gz stays for brew/install.sh on unix.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - agents/README.md
      - agents/manifest.json
      - agents/skills/**/SKILL.md
  # Provider binaries upload raw beside the CLI archives (default binary name
  # template). Windows .exe handling and bundle upload are verified on the
  # first tag release; see ADR 0011.
  - id: provider-gcp
    ids: [magelift-provider-gcp]
    formats: [binary]
  - id: provider-azure
    ids: [magelift-provider-azure]
    formats: [binary]

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
  - id: provider-aws
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: binary
    ids: [provider-aws]
  - id: provider-gcp
    cmd: cosign
    # Per-binary bundle for the provider artifacts. signs (unlike
    # binary_signs) runs at release time only, so the local `build` smoke
    # stays offline. The CLI verifies the installed provider binary against
    # this bundle before Dial.
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: binary
    ids: [provider-gcp]
  - id: provider-azure
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: binary
    ids: [provider-azure]

# Homebrew cask with binary stanzas: goreleaser deprecated brews (formula
# generation) in v2.16 in favor of homebrew_casks; casks install binaries on
# macOS and Linuxbrew alike. Casks live in Casks/ (default) — no Formula dir.
# HOMEBREW_TAP_GITHUB_TOKEN is currently acourtiol's OAuth token (repo scope);
# upgrade path: a GitHub App with contents:write on homebrew-tap + scoop-bucket.
homebrew_casks:
  - name: magelift
    # The cask installs the CLI archive. Provider binaries remain separate
    # release assets and are downloaded by the CLI when needed.
    ids:
      - cli
    repository:
      owner: magelift
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://magelift.dev
    description: Open-source Magento CLI for AWS, Google Cloud and Azure
    license: Apache-2.0
    binaries:
      - magelift

scoops:
  - name: magelift
    # Same single-archive rule as the cask: scoop ships the CLI.
    ids:
      - cli
    repository:
      owner: magelift
      name: scoop-bucket
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://magelift.dev
    description: Open-source Magento CLI for AWS, Google Cloud and Azure
    license: Apache-2.0

release:
  # Fail before cross-compiling if GitHub cannot publish this tag
  # (missing token, or an immutable release that cannot be updated).
  preflight:
    fail_on_error: true
  # Channels: every release stays draft until the workflow verifies the full
  # artifact set (bundles, checksums, lockfiles) and publishes it. Every
  # release is a prerelease and never "latest": hyphen tags (rc, alpha,
  # beta) must not become the default install channel. Flip prerelease and
  # make_latest only for the first stable release, and update install.sh,
  # the upgrade channel, and docs/install.md together.
  draft: true
  prerelease: true
  make_latest: false

changelog:
  use: github-native
