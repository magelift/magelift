# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.0/www/docs/static/schema.json
version: 2

# Local packaging smoke: use scripts/release-smoke-local.sh or make release-smoke
# (--single-target --parallelism=1). Full multi-platform matrices belong on CI.

project_name: magelift

builds:
  - id: magelift
    main: ./cmd/magelift
    binary: magelift
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X github.com/magelift/magelift/internal/cli.Version={{ .Version }}

archives:
  - id: cli
    ids: [magelift]
    formats: [tar.gz]
    # Scoop convention is zip; tar.gz stays for brew/install.sh on unix.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# Homebrew cask with binary stanzas: goreleaser deprecated brews (formula
# generation) in v2.16 in favor of homebrew_casks; casks install binaries on
# macOS and Linuxbrew alike. Casks live in Casks/ (default) — no Formula dir.
# HOMEBREW_TAP_GITHUB_TOKEN is currently acourtiol's OAuth token (repo scope);
# upgrade path: a GitHub App with contents:write on homebrew-tap + scoop-bucket.
homebrew_casks:
  - name: magelift
    repository:
      owner: magelift
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://magelift.dev
    description: Open-source Magento CLI for your AWS or GCP account
    license: Apache-2.0
    binaries:
      - magelift

scoops:
  - name: magelift
    repository:
      owner: magelift
      name: scoop-bucket
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://magelift.dev
    description: Open-source Magento CLI for your AWS or GCP account
    license: Apache-2.0

changelog:
  use: github-native
