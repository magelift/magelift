<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /app/pub
    DirectoryIndex index.php

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    Alias "/health" "/usr/local/share/magelift/health"
    <Location "/health">
        ForceType text/plain
        Require all granted
    </Location>

    <Directory /app/pub>
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    <LocationMatch "^/(?:\.git|app/etc|var|vendor)/">
        Require all denied
    </LocationMatch>
</VirtualHost>
