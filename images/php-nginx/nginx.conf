worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 64m;
    client_body_temp_path /tmp;
    proxy_temp_path /tmp;
    fastcgi_temp_path /tmp;
    uwsgi_temp_path /tmp;
    scgi_temp_path /tmp;

    server {
        listen 8080;
        server_name _;
        root /app/pub;
        index index.php;

        # ALB/ECS liveness: no Magento bootstrap (static OK; prior Magento-on-AWS pattern).
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Remote-media delivery: uncached media materializes through
        # get.php, whose Synchronizer pulls from remote storage. The
        # media bucket stays private; browsers never fetch it directly.
        # Sensitive trees use ^~ so prefix denies beat any later regex.
        # Stock Magento also denies theme_customization XML and every
        # script that is not an approved entry point.
        location ^~ /media/customer/ {
            deny all;
        }

        location ^~ /media/downloadable/ {
            deny all;
        }

        location ^~ /media/import/ {
            deny all;
        }

        location ^~ /media/custom_options/ {
            deny all;
        }

        location /media/ {
            location ~ ^/media/theme_customization/.*\.xml$ {
                deny all;
            }
            try_files $uri $uri/ /get.php$is_args$args;
        }

        # Approved Magento entry points only. A generic \.php$ handler
        # executes files under denied prefixes because regex locations
        # beat ordinary prefix locations (nginx ngx_http_core_module).
        location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_pass 127.0.0.1:9000;
        }

        location ~* (\.php$|\.phtml$|\.htaccess$|\.htpasswd$|\.git) {
            deny all;
        }

        location ~* /(?:\.git|app/etc|var|vendor)/ {
            deny all;
        }
    }
}
