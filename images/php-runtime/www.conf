[www]
user = magelift
group = magelift
listen = 0.0.0.0:9000
; deployment-config.php resolves the MAGENTO_DC_* placeholders from the
; container environment on every PHP request. Keep the pod/task environment
; visible to FPM workers; clear_env=yes silently restores localhost defaults.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 5
ping.path = /fpm-ping
pm.status_path = /fpm-status
