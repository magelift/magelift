# Synthetic Upsun env allowlist vars (D-07). Values must never appear as plaintext in magelift.yaml.
stage:
  global:
    SCD_STRATEGY: standard
    SCD_THREADS: "4"
    CONFIG__DEFAULT__ADMIN__URL__FRONT_NAME: admin_upsun
    CONFIG__DEFAULT__WEB__COOKIE__COOKIE_DOMAIN: ".preview.example.com"
    CONFIG__DEFAULT__WEB__CORS__ORIGINS: "https://storefront.preview.example.com"
  deploy:
    CRYPT_KEY: "upsun-crypt-must-not-leak"
    UPDATE_URLS: "preview.example.com"
    CONFIG__DEFAULT__CRON__CONSUMERS_RUNNER__MODE: both
    CONFIG__DEFAULT__CRON__CONSUMERS_RUNNER__CONSUMERS: "async.operations.all,product_action_attribute.update"
