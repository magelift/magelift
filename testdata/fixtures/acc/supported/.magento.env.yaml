# Synthetic ACC env allowlist vars (D-07). Values must never appear as plaintext in magelift.yaml.
stage:
  global:
    SCD_STRATEGY: compact
    CONFIG__DEFAULT__ADMIN__URL__FRONT_NAME: backstage
    CONFIG__DEFAULT__WEB__COOKIE__COOKIE_DOMAIN: ".shop.example"
    CONFIG__DEFAULT__WEB__GRAPHQL__CORS_ORIGINS: "https://storefront.example,https://preview.storefront.example"
  deploy:
    CRYPT_KEY: "synthetic-crypt-must-not-leak"
    CONFIG__DEFAULT__CRON__CONSUMERS_RUNNER__MODE: processes
    CONFIG__DEFAULT__CRON__CONSUMERS_RUNNER__CONSUMERS: "product_action_attribute.update,inventory.reservations.update"
