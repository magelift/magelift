site_name: MageLift
site_description: Run Magento 2 locally and deploy to your own AWS, Google Cloud, or Azure account.
site_url: https://magelift.dev/docs/
repo_url: https://github.com/magelift/magelift
repo_name: magelift/magelift
docs_dir: docs
strict: true
exclude_docs: |
  evidence/runs/**
  evidence/ovh-mks-infrastructure-live-2026-08-12.md
  evidence/scaleway-kapsule-infrastructure-live-2026-09-15.md
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.png
  favicon: assets/favicon.svg
  # The stylesheet defines site colors. Bump its filename when CSS changes
  # so browsers fetch the new asset.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  font:
    text: Source Sans 3
    code: IBM Plex Mono
extra_css:
  - stylesheets/magelift.v3.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/magelift/magelift
    - icon: fontawesome/solid/globe
      link: https://magelift.dev/
nav:
  - Home: index.md
  - Start:
      - What MageLift does: what-magelift-does.md
      - Install: install.md
      - Getting started: getting-started.md
      - Deploy to Google Cloud: onboarding.md
      - Local vs cloud: local-vs-cloud.md
      - Compare to PaaS: compare-paas.md
      - FAQ: faq.md
  - Migrate:
      - Import an existing shop: migrating-from-paas.md
      - Rehearse the data migration: weekend-migrate.md
      - Use an existing AWS VPC or database: brownfield-attach.md
      - Adobe Commerce Cloud settings: ece-parity.md
  - Operate:
      - Configuration: configuration.md
      - Service bindings: service-bindings.md
      - CLI reference: cli-reference.md
      - Secrets: secrets.md
      - Day-2 operations: operations.md
      - Application builds: builds.md
      - Storefront recipes: storefront-recipes.md
      - Compatibility: compatibility.md
  - Cloud targets:
      - Provider support: capability-matrix.md
      - Connect a cloud account: bootstrap.md
      - Experimental:
          - AWS EKS: aws-eks-experimental.md
          - GCP notes: gcp-experimental.md
  - Reference:
      - Architecture: architecture.md
      - Adding a provider: adding-a-provider.md
      - Provenance: provenance.md
      - Architecture decisions: adr/README.md
  - Project:
      - Versioning: versioning.md
      - Publishing: publishing.md
      - Evidence: evidence/README.md
      - Lint policy: lint-policy.md
      - Dependency policy: dependency-policy.md
      - GitHub labels: github-labels.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
