name: MageLift CI

# target: aws/ecs-fargate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "preview"
          - "staging"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install MageLift
        run: go install github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Validate configuration
        run: magelift --config 'magelift.yaml' --no-interaction config validate
      - name: Resolve environment
        run: magelift --config 'magelift.yaml' --env "${{ matrix.environment }}" --no-interaction --output json config effective > /dev/null

  build:
    name: Build and sign immutable image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.MAGELIFT_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Install MageLift
        run: go install -ldflags="-X github.com/magelift/magelift/internal/cli.Version=v1.0.0-rc.1" github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Build and sign image
        id: build
        env:
          MAGELIFT_RELEASE_IMAGE: ${{ vars.MAGELIFT_RELEASE_IMAGE }}
          MAGELIFT_BUILDER_IMAGE: ${{ vars.MAGELIFT_BUILDER_IMAGE }}
          MAGELIFT_RUNTIME_IMAGE: ${{ vars.MAGELIFT_RUNTIME_IMAGE }}
        run: |
          set -eu
          for required in MAGELIFT_RELEASE_IMAGE MAGELIFT_BUILDER_IMAGE MAGELIFT_RUNTIME_IMAGE; do
            test -n "${!required}"
          done
          magelift --config 'magelift.yaml' --no-interaction --output json build --push \
            --image "$MAGELIFT_RELEASE_IMAGE" \
            --builder-image "$MAGELIFT_BUILDER_IMAGE" \
            --runtime-image "$MAGELIFT_RUNTIME_IMAGE" > build-result.json
          digest="$(jq -er '.image.imageReference + "@" + .image.digest' build-result.json)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview infrastructure
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'magelift-preview')
    needs: validate
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: magelift-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install MageLift
        run: go install -ldflags="-X github.com/magelift/magelift/internal/cli.Version=v1.0.0-rc.1" github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.MAGELIFT_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate environment variable
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_PREVIEW_ENV }}
        run: test -n "$DEPLOY_ENV"
      - name: Preview selected environment
        env:
          PREVIEW_ENV: ${{ vars.MAGELIFT_PREVIEW_ENV }}
          PREVIEW_REPOSITORY: ${{ github.repository }}
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
          PREVIEW_GENERATION: ${{ github.run_id }}
        run: |
          set -eu
          test -n "$PREVIEW_ENV"
          test -n "$PREVIEW_REPOSITORY"
          test -n "$PREVIEW_NUMBER"
          test -n "$PREVIEW_COMMIT"
          magelift --config 'magelift.yaml' --env "$PREVIEW_ENV" --preview-repository "$PREVIEW_REPOSITORY" --preview-number "$PREVIEW_NUMBER" --preview-branch "$PREVIEW_BRANCH" --preview-commit "$PREVIEW_COMMIT" --preview-generation "$PREVIEW_GENERATION" --no-interaction preview

  preview-destroy:
    name: Destroy closed preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'magelift-preview')
    needs: validate
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: magelift-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install MageLift
        run: go install -ldflags="-X github.com/magelift/magelift/internal/cli.Version=v1.0.0-rc.1" github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.MAGELIFT_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate environment variable
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_PREVIEW_ENV }}
        run: test -n "$DEPLOY_ENV"
      - name: Destroy preview environment
        env:
          PREVIEW_ENV: ${{ vars.MAGELIFT_PREVIEW_ENV }}
          PREVIEW_REPOSITORY: ${{ github.repository }}
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
          PREVIEW_GENERATION: ${{ github.run_id }}
        run: |
          set -eu
          test -n "$PREVIEW_ENV"
          test -n "$PREVIEW_REPOSITORY"
          test -n "$PREVIEW_NUMBER"
          test -n "$PREVIEW_COMMIT"
          magelift --config 'magelift.yaml' --env "$PREVIEW_ENV" --preview-repository "$PREVIEW_REPOSITORY" --preview-number "$PREVIEW_NUMBER" --preview-branch "$PREVIEW_BRANCH" --preview-commit "$PREVIEW_COMMIT" --preview-generation "$PREVIEW_GENERATION" --no-interaction --yes destroy

  preview-sweep:
    name: Sweep expired previews
    if: github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install MageLift
        run: go install -ldflags="-X github.com/magelift/magelift/internal/cli.Version=v1.0.0-rc.1" github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.MAGELIFT_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Destroy expired previews
        run: |
          test -n "${{ vars.MAGELIFT_PREVIEW_ENV }}"
          magelift --config 'magelift.yaml' --env "${{ vars.MAGELIFT_PREVIEW_ENV }}" --preview-repository "${{ github.repository }}" --no-interaction --yes env sweep

  staging:
    name: Deploy staging
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) && needs.build.result == 'success'
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install MageLift
        run: go install -ldflags="-X github.com/magelift/magelift/internal/cli.Version=v1.0.0-rc.1" github.com/magelift/magelift/cmd/magelift@v1.0.0-rc.1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.MAGELIFT_STAGING_ROLE_ARN }}
          aws-region: ${{ vars.MAGELIFT_AWS_REGION }}
          mask-aws-account-id: true
      - name: Validate environment variable
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_STAGING_ENV }}
        run: test -n "$DEPLOY_ENV"
      - name: Deploy immutable digest
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_STAGING_ENV }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          test "$DEPLOY_ENV" = staging
          magelift --config 'magelift.yaml' --env "$DEPLOY_ENV" --no-interaction --yes deploy --digest "$DIGEST"
