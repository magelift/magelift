          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift providers install
      - name: Validate GCP deployment variables
        env:
          GCP_PROJECT_ID: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.MAGELIFT_GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.MAGELIFT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.MAGELIFT_GCP_PREVIEW_SERVICE_ACCOUNT }}
        run: |
          set -eu
          test -n "$GCP_PROJECT_ID"
          test "$GCP_PROJECT_ID" = 'example-gcp-project'
          test -n "$GCP_REGION"
          test "$GCP_REGION" = 'europe-west1'
          test -n "$GCP_WIF_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.MAGELIFT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MAGELIFT_GCP_PREVIEW_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Relocate GCP federated credentials
        run: |
          set -eu
          src="${GOOGLE_GHA_CREDS_PATH:?GOOGLE_GHA_CREDS_PATH is required}"
          workspace_real="$(realpath -- "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}")"
          runner_temp="$(realpath -- "${RUNNER_TEMP:?RUNNER_TEMP is required}")"
          if [ -L "$src" ] || [ ! -f "$src" ]; then
            echo 'credential file must be a regular file' >&2
            exit 1
          fi
          src_real="$(realpath -- "$src")"
          case "$src_real" in
            "$workspace_real"/gha-creds-*.json) ;;
            *) echo 'unexpected credential file outside GITHUB_WORKSPACE or with an invalid name' >&2; exit 1 ;;
          esac
          case "$runner_temp" in
            "$workspace_real"|"$workspace_real"/*)
              echo 'configure RUNNER_TEMP outside GITHUB_WORKSPACE' >&2
              exit 1 ;;
          esac
          dest="$(mktemp "$runner_temp/gha-creds-reloc-XXXXXXXX")"
          cleanup() { rm -f -- "$dest"; }
          trap cleanup EXIT
          mv -- "$src" "$dest"
          chmod 0600 "$dest"
          {
            echo "GOOGLE_GHA_CREDS_PATH=$dest"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$dest"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$dest"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          version: '589.0.0'
      - name: Destroy expired previews
        run: |
          test -n "${{ vars.MAGELIFT_PREVIEW_ENV }}"
          magelift --config 'magelift.yaml' --env "${{ vars.MAGELIFT_PREVIEW_ENV }}" --preview-repository "${{ github.repository }}" --no-interaction --yes env sweep

  staging:
    name: Deploy staging
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) && needs.build.result == 'success'
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v1.0.0-rc.1
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift providers install
      - name: Validate GCP deployment variables
        env:
          GCP_PROJECT_ID: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.MAGELIFT_GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.MAGELIFT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.MAGELIFT_GCP_STAGING_SERVICE_ACCOUNT }}
          DEPLOY_ENV: ${{ vars.MAGELIFT_STAGING_ENV }}
        run: |
          set -eu
          test -n "$GCP_PROJECT_ID"
          test "$GCP_PROJECT_ID" = 'example-gcp-project'
          test -n "$GCP_REGION"
          test "$GCP_REGION" = 'europe-west1'
          test -n "$GCP_WIF_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"
          test -n "$DEPLOY_ENV"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.MAGELIFT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MAGELIFT_GCP_STAGING_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Relocate GCP federated credentials
        run: |
          set -eu
          src="${GOOGLE_GHA_CREDS_PATH:?GOOGLE_GHA_CREDS_PATH is required}"
          workspace_real="$(realpath -- "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}")"
          runner_temp="$(realpath -- "${RUNNER_TEMP:?RUNNER_TEMP is required}")"
          if [ -L "$src" ] || [ ! -f "$src" ]; then
            echo 'credential file must be a regular file' >&2
            exit 1
          fi
          src_real="$(realpath -- "$src")"
          case "$src_real" in
            "$workspace_real"/gha-creds-*.json) ;;
            *) echo 'unexpected credential file outside GITHUB_WORKSPACE or with an invalid name' >&2; exit 1 ;;
          esac
          case "$runner_temp" in
            "$workspace_real"|"$workspace_real"/*)
              echo 'configure RUNNER_TEMP outside GITHUB_WORKSPACE' >&2
              exit 1 ;;
          esac
          dest="$(mktemp "$runner_temp/gha-creds-reloc-XXXXXXXX")"
          cleanup() { rm -f -- "$dest"; }
          trap cleanup EXIT
          mv -- "$src" "$dest"
          chmod 0600 "$dest"
          {
            echo "GOOGLE_GHA_CREDS_PATH=$dest"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$dest"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$dest"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          version: '589.0.0'
      - name: Download existing artifact manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: magelift-build-${{ github.run_id }}
          path: ${{ runner.temp }}/magelift-build/
      - name: Verify artifact handoff
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        working-directory: ${{ runner.temp }}/magelift-build/
        run: |
          set -eu
          sha256sum -c manifest.sha256
          test "$(jq -er '.image.imageReference + "@" + .image.digest' build-result.json)" = "$DIGEST"
          test "$(jq -er '.imageDigest' manifest.json)" = "${DIGEST##*@}"
      - name: Deploy immutable digest
        env:
          DEPLOY_ENV: ${{ vars.MAGELIFT_STAGING_ENV }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          test "$DEPLOY_ENV" = staging
          magelift --config 'magelift.yaml' --env "$DEPLOY_ENV" --no-interaction --yes deploy --digest "$DIGEST"
