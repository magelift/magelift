            *) echo 'unexpected credential file outside GITHUB_WORKSPACE or with an invalid name' >&2; exit 1 ;;
          esac
          case "$runner_temp" in
            "$workspace_real"|"$workspace_real"/*)
              echo 'configure RUNNER_TEMP outside GITHUB_WORKSPACE' >&2
              exit 1 ;;
          esac
          dest="$(mktemp "$runner_temp/gha-creds-reloc-XXXXXXXX")"
          cleanup() { rm -f -- "$dest"; }
          trap cleanup EXIT
          mv -- "$src" "$dest"
          chmod 0600 "$dest"
          {
            echo "GOOGLE_GHA_CREDS_PATH=$dest"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$dest"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$dest"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          version: '589.0.0'
      - name: Destroy preview environment
        env:
          PREVIEW_ENV: ${{ vars.MAGELIFT_PREVIEW_ENV }}
          PREVIEW_REPOSITORY: ${{ github.repository }}
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
          PREVIEW_GENERATION: ${{ github.run_id }}
        run: |
          set -eu
          test -n "$PREVIEW_ENV"
          test -n "$PREVIEW_REPOSITORY"
          test -n "$PREVIEW_NUMBER"
          test -n "$PREVIEW_COMMIT"
          magelift --config 'magelift.yaml' --env "$PREVIEW_ENV" --preview-repository "$PREVIEW_REPOSITORY" --preview-number "$PREVIEW_NUMBER" --preview-branch "$PREVIEW_BRANCH" --preview-commit "$PREVIEW_COMMIT" --preview-generation "$PREVIEW_GENERATION" --no-interaction --yes destroy

  preview-sweep:
    name: Sweep expired previews
    if: github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
