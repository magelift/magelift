name: Actions Security

# Workflow/config changes + weekly. dependency-review requires GitHub
# Advanced Security / Dependency graph, which this public repo does not have.
on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Code scanning / GHAS is not enabled on this repo; SARIF upload fails weekly
      # with "Code scanning is not enabled". Console findings still gate the job.
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false
          min-severity: medium
