name: CodeQL

# Analyze Go changes and run a weekly scan. Dependency PRs run govulncheck in CI.
on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'providers/*/go.mod'
      - 'providers/*/go.sum'
      - 'sdk/go.mod'
      - 'go.work'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Dependabot PRs still match go.mod paths; skip hosted CodeQL minutes there.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CodeQL does not treat PHP as a first-class language here; Go needs a real build.
        include:
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
        if: matrix.language == 'go'
      - uses: ./.github/actions/go-memlimit
        if: matrix.language == 'go'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          # Enable uploads once the repository has GitHub code scanning.
          upload: never
        continue-on-error: false
