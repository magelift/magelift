name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          mapfile -t go_files < <(git ls-files '*.go')
          gofmt -w "${go_files[@]}"
          git diff --exit-code
      - run: go build -o /tmp/genconfig ./cmd/genconfig && /tmp/genconfig --check
      - run: go build -o /tmp/gendocs ./cmd/gendocs && /tmp/gendocs --check
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
      - name: Check Go dependency licenses
        run: go run github.com/google/go-licenses/v2@v2.0.1 check ./... --disallowed_types=forbidden,unknown
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer audit --locked
      - run: composer analyse
      - run: composer psalm
      - run: vendor/bin/phpunit --fail-on-deprecation --fail-on-notice --fail-on-warning
  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - {branch: '8.2', target: '8-2'}
          - {branch: '8.3', target: '8-3'}
          - {branch: '8.4', target: '8-4'}
          - {branch: '8.5', target: '8-5'}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build runtime and builder
        run: >-
          docker buildx bake
          php-runtime-${{ matrix.php.target }}
          php-builder-${{ matrix.php.target }}
          --load
          --provenance=false
          --sbom=false
          --set '*.platform=linux/amd64'
      - name: Inspect runtime
        env:
          PHP_BRANCH: ${{ matrix.php.branch }}
        run: |
          image="magelift/php-runtime:${PHP_BRANCH}-local"
          test "$(docker run --rm "$image" id -u)" = 10001
          test "$(docker run --rm "$image" php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$PHP_BRANCH"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.magelift.php.branch" }}')" = "$PHP_BRANCH"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.magelift.nginx.version" }}')" = "1.30.4"
          docker run --rm "$image" php-fpm --test
          test "$(docker run --rm --entrypoint nginx "$image" -v 2>&1)" = "nginx version: nginx/1.30.4"
          docker run --rm --entrypoint nginx "$image" -t -c /etc/nginx/nginx.conf
          docker run --rm --read-only --tmpfs /tmp:uid=10001,gid=10001 "$image" php -r 'file_put_contents(sys_get_temp_dir() . "/probe", "ok");'
          docker run --rm "$image" php -r '$required = ["bcmath", "gd", "intl", "pdo_mysql", "soap", "sockets", "xsl", "zip", "Zend OPcache"]; $missing = array_values(array_filter($required, fn(string $extension): bool => !extension_loaded($extension))); if ($missing !== []) { fwrite(STDERR, "Missing PHP extensions: " . implode(", ", $missing) . PHP_EOL); exit(1); }'
      - name: Inspect builder
        env:
          PHP_BRANCH: ${{ matrix.php.branch }}
        run: |
          image="magelift/php-builder:${PHP_BRANCH}-local"
          runtime="magelift/php-runtime:${PHP_BRANCH}-local"
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001
          test "$(docker run --rm --entrypoint php "$image" -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$PHP_BRANCH"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.magelift.php.base" }}')" = "$(docker image inspect "$runtime" --format '{{ index .Config.Labels "io.magelift.php.base" }}')"
          docker run --rm --entrypoint composer "$image" --version

  frankenphp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - {branch: '8.2', target: '8-2'}
          - {branch: '8.3', target: '8-3'}
          - {branch: '8.4', target: '8-4'}
          - {branch: '8.5', target: '8-5'}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and inspect classic adapter
        env:
          PHP_BRANCH: ${{ matrix.php.branch }}
        run: |
          target="frankenphp-classic-${{ matrix.php.target }}"
          image="magelift/frankenphp-classic:${PHP_BRANCH}-local"
          docker buildx bake "$target" --load --provenance=false --sbom=false --set "$target.platform=linux/amd64"
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001
          docker run --rm --entrypoint frankenphp "$image" version
          MAGELIFT_FRANKENPHP_IMAGE="$image" ./scripts/frankenphp-tls-test.sh

  varnish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify read-only Varnish sidecar
        run: ./scripts/varnish-test.sh

  floci:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:1.5.33@sha256:d2ecc8035822b23b8587a56eab15edd825f41d3fb80d93e8e66680410beddc08
        ports:
          - 4566:4566
        env:
          FLOCI_DEFAULT_REGION: us-east-1
          FLOCI_DEFAULT_ACCOUNT_ID: '000000000000'
          FLOCI_STORAGE_MODE: memory
          FLOCI_AUTH_VALIDATE_SIGNATURES: 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run Floci AWS contract tests
        env:
          MAGELIFT_FLOCI: '1'
          MAGELIFT_FLOCI_ENDPOINT: http://127.0.0.1:4566
        run: go test -race -tags=floci ./tests/floci -count=1

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: >-
          docker run --rm --entrypoint /bin/sh
          -v "$PWD:/src:ro"
          koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
          -c 'shellcheck --severity=warning /src/scripts/*.sh'

  image-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: 'php-runtime-8-2', image: 'magelift/php-runtime:8.2-local'}
          - {target: 'php-runtime-8-3', image: 'magelift/php-runtime:8.3-local'}
          - {target: 'php-runtime-8-4', image: 'magelift/php-runtime:8.4-local'}
          - {target: 'php-runtime-8-5', image: 'magelift/php-runtime:8.5-local'}
          - {target: 'php-builder-8-2', image: 'magelift/php-builder:8.2-local'}
          - {target: 'php-builder-8-3', image: 'magelift/php-builder:8.3-local'}
          - {target: 'php-builder-8-4', image: 'magelift/php-builder:8.4-local'}
          - {target: 'php-builder-8-5', image: 'magelift/php-builder:8.5-local'}
          - {target: 'frankenphp-classic-8-2', image: 'magelift/frankenphp-classic:8.2-local'}
          - {target: 'frankenphp-classic-8-3', image: 'magelift/frankenphp-classic:8.3-local'}
          - {target: 'frankenphp-classic-8-4', image: 'magelift/frankenphp-classic:8.4-local'}
          - {target: 'frankenphp-classic-8-5', image: 'magelift/frankenphp-classic:8.5-local'}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image for scanning
        env:
          TARGET: ${{ matrix.target }}
        run: docker buildx bake "$TARGET" --load --provenance=false --sbom=false --set "$TARGET.platform=linux/amd64"
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: '1'
