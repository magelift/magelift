name: Validate Container Recipes

# MageLift ships recipes. Users build and publish images in their own CI/registry.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.image }} PHP ${{ matrix.php }} (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.3'
            base: docker.io/library/php:8.3.37-fpm-trixie@sha256:a216054d3de38bc1e45704ef75402a6c43b659ef84f6adc0fa494b2233c195e0
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.4'
            base: docker.io/library/php:8.4.28-fpm-trixie@sha256:9185c66c60705ef5775fc2f9f92bcda1a3645b3d195abaccecc37485c28eded8
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.5'
            base: docker.io/library/php:8.5.13-fpm-trixie@sha256:52ba6f178d0a08f348578b03595661b7ff13defafacf4c823d045f2ecba8db8f
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.3'
            base: docker.io/library/php:8.3.37-fpm-trixie@sha256:a216054d3de38bc1e45704ef75402a6c43b659ef84f6adc0fa494b2233c195e0
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.4'
            base: docker.io/library/php:8.4.28-fpm-trixie@sha256:9185c66c60705ef5775fc2f9f92bcda1a3645b3d195abaccecc37485c28eded8
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.5'
            base: docker.io/library/php:8.5.13-fpm-trixie@sha256:52ba6f178d0a08f348578b03595661b7ff13defafacf4c823d045f2ecba8db8f
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.3'
            base: docker.io/dunglas/frankenphp:1.13.5-php8.3-trixie@sha256:5e17d7af9314b54213588803f117a2d482b6ba270b7d41381400ec78db45b36e
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.4'
            base: docker.io/dunglas/frankenphp:1.13.5-php8.4-trixie@sha256:8f0d509ad824fa86da88b55c5ea9f1605380f423ab55ec3a72864cc223491bfd
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.5'
            base: docker.io/dunglas/frankenphp:1.13.5-php8.5-trixie@sha256:667c5fffd348d9c3c260803d75956f1d9aace7e4b7331d8893de6f101d7e0e57
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.0
      - name: Build recipe without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: |
            PHP_BASE=${{ matrix.base }}
            FRANKENPHP_BASE=${{ matrix.base }}
            PHP_BRANCH=${{ matrix.php }}
          tags: magelift-validation:${{ matrix.image }}-${{ matrix.php }}
          push: false
          load: true
          provenance: false
          sbom: false
      - name: Check PHP recipe
        env:
          IMAGE: ${{ matrix.image }}
          PHP_BRANCH: ${{ matrix.php }}
        run: |
          docker run --rm --entrypoint php --env EXPECTED_PHP_BRANCH="$PHP_BRANCH" "magelift-validation:${IMAGE}-${PHP_BRANCH}" -r 'if (PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION !== getenv("EXPECTED_PHP_BRANCH")) { exit(1); }'
