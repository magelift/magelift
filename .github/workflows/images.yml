name: Release Container Images

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  publish:
    name: ${{ matrix.image }} PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: runtime
            file: images/php-runtime/Dockerfile
            target: runtime
            php: '8.2'
            base: docker.io/library/php:8.2-fpm-trixie@sha256:ecc8e257cfc08404b00909e560656df4b5461f21099fd645b507862f84dce358
          - image: runtime
            file: images/php-runtime/Dockerfile
            target: runtime
            php: '8.3'
            base: docker.io/library/php:8.3-fpm-trixie@sha256:32b6cb4cf9f41d3e62424e64959bbf824125ca7b7869c18fb54d4bafc9d990b4
          - image: runtime
            file: images/php-runtime/Dockerfile
            target: runtime
            php: '8.4'
            base: docker.io/library/php:8.4-fpm-trixie@sha256:3661dc717d73bdb0ec58bcdc96af36af90f8894c66c09ac74721a012b01da6f4
          - image: runtime
            file: images/php-runtime/Dockerfile
            target: runtime
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:0dc450d0a0e81ba501973b8e303f5d45af2ed989e08730f597d8fc07fb289efd
          - image: builder
            file: images/php-runtime/Dockerfile
            target: builder
            php: '8.2'
            base: docker.io/library/php:8.2-fpm-trixie@sha256:ecc8e257cfc08404b00909e560656df4b5461f21099fd645b507862f84dce358
          - image: builder
            file: images/php-runtime/Dockerfile
            target: builder
            php: '8.3'
            base: docker.io/library/php:8.3-fpm-trixie@sha256:32b6cb4cf9f41d3e62424e64959bbf824125ca7b7869c18fb54d4bafc9d990b4
          - image: builder
            file: images/php-runtime/Dockerfile
            target: builder
            php: '8.4'
            base: docker.io/library/php:8.4-fpm-trixie@sha256:3661dc717d73bdb0ec58bcdc96af36af90f8894c66c09ac74721a012b01da6f4
          - image: builder
            file: images/php-runtime/Dockerfile
            target: builder
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:0dc450d0a0e81ba501973b8e303f5d45af2ed989e08730f597d8fc07fb289efd
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.2'
            base: docker.io/dunglas/frankenphp:1.12.4-php8.2-trixie@sha256:e9552431aa69ce4b6da625c14bd19b4b127b8d8a37252369efb3a5ea05074d2a
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.3'
            base: docker.io/dunglas/frankenphp:1.12.4-php8.3-trixie@sha256:28c061d337d6b9e893190e4d8d2d1112d6ad18f840574e22630a73ad7156adbb
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.4'
            base: docker.io/dunglas/frankenphp:1.12.4-php8.4-trixie@sha256:a6b2340a4a9b70fc25d3afe663052d64da949721ff081399533856fba86fa3f4
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.5'
            base: docker.io/dunglas/frankenphp:1.12.4-php8.5-trixie@sha256:a0ad00db3dd7f61b55a9951c9b6ef73ac8e1dd4c6de36979a0d1651b48da5f43

    env:
      IMAGE: ghcr.io/acourtiol/magelift-${{ matrix.image }}
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_BASE=${{ matrix.base }}
            NGINX_BASE=docker.io/library/nginx:1.30.4-trixie@sha256:5cf90903deda2c5981b8ad05e7617ac010e389f0dde0ac83487c02c509281de6
            FRANKENPHP_BASE=${{ matrix.base }}
            PHP_BRANCH=${{ matrix.php }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.php }}
            ${{ env.IMAGE }}:${{ matrix.php }}-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/acourtiol/magelift
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=MageLift ${{ matrix.image }} PHP ${{ matrix.php }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (cosign 3.0.6)
      - name: Sign published digest
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Verify published digest
        run: >-
          cosign verify
          --certificate-identity "https://github.com/acourtiol/magelift/.github/workflows/images.yml@refs/tags/${VERSION}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Publish registry provenance attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
