name: Release Container Images

# Stable tags keep the existing catalog publication. Community alpha uses a
# manual, Linux amd64 PHP 8.5 builder/runtime run; publishing is opt-in.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit image version (vX.Y.Z or prerelease), approved before publishing
        required: true
        type: string
      publish:
        description: Publish the two reviewed community alpha images to GHCR
        type: boolean
        default: false
  push:
    # `sdk/v*` module tags never match: `v*` anchors at the start of
    # the ref name. Any tag containing `-` (`-rc`, `-alpha`) is out.
    tags: ['v*', '!*-*', 'images/community-alpha.*']

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  publish:
    name: ${{ matrix.image }} PHP ${{ matrix.php }}
    # Skip prerelease tags (semver uses '-' for -rc / -alpha / -beta).
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.2'
            base: docker.io/library/php:8.2-fpm-trixie@sha256:596175799ca76a93d5d0c3cda7d5f70fccfc86dfdaf97580c1c27e665aba991f
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.3'
            base: docker.io/library/php:8.3-fpm-trixie@sha256:5ad27201cf5cdf1704e147218e64fa0db2155ecda26edbe2b3eeb7b90cbf9328
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.4'
            base: docker.io/library/php:8.4-fpm-trixie@sha256:59fa733c9af643a122f8a9976119460e35ce76dd0a3f2b9c8f75af8e361a54e2
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:adde18b67ea7a8cddc580f657e0d3f16e800758c6fa690b969c2925a303e8afc
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.2'
            base: docker.io/library/php:8.2-fpm-trixie@sha256:596175799ca76a93d5d0c3cda7d5f70fccfc86dfdaf97580c1c27e665aba991f
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.3'
            base: docker.io/library/php:8.3-fpm-trixie@sha256:5ad27201cf5cdf1704e147218e64fa0db2155ecda26edbe2b3eeb7b90cbf9328
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.4'
            base: docker.io/library/php:8.4-fpm-trixie@sha256:59fa733c9af643a122f8a9976119460e35ce76dd0a3f2b9c8f75af8e361a54e2
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:adde18b67ea7a8cddc580f657e0d3f16e800758c6fa690b969c2925a303e8afc
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.2'
            base: docker.io/dunglas/frankenphp:1.12.7-php8.2-trixie@sha256:3c1ad970186bc0d3b47d0ff3212f9f47dfa0e6c7e5dbb68bec19ed9c6464c466
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.3'
            base: docker.io/dunglas/frankenphp:1.12.7-php8.3-trixie@sha256:b0029775078a8434f74f7c694e0634e4a8e1a81b758132b22baaf42110a176b4
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.4'
            base: docker.io/dunglas/frankenphp:1.12.7-php8.4-trixie@sha256:77bc2d40a58ace3a9425e4cbb0c40d044188dfd850e44a943ed043d743625df3
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.5'
            base: docker.io/dunglas/frankenphp:1.12.7-php8.5-trixie@sha256:f92d81eb3fe4fd18b35d3d58192b7cc3acc8943817bbf39f2fcf0be02a3916dc

    env:
      IMAGE: ghcr.io/magelift/magelift-${{ matrix.image }}
      VERSION: ${{ github.ref_name }}
      COMMUNITY_ALPHA: 'false'
      SIGNING_IDENTITY: https://github.com/${{ github.workflow_ref }}

    steps: &image-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate image version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            printf 'An explicit semantic image version is required\n' >&2
            exit 2
          fi
          if [[ "$GITHUB_REF" == refs/tags/images/community-alpha.* ]]; then
            approved_sha="${GITHUB_REF#refs/tags/images/community-alpha.}"
            if [[ ! "$approved_sha" =~ ^[a-f0-9]{40}$ || "$approved_sha" != "$GITHUB_SHA" ]]; then
              printf 'Community image tag must identify its exact source commit\n' >&2
              exit 2
            fi
          fi
      - if: ${{ env.COMMUNITY_ALPHA != 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0
      - if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ env.COMMUNITY_ALPHA == 'true' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          push: ${{ github.event_name == 'push' || inputs.publish }}
          build-args: |
            PHP_BASE=${{ matrix.base }}
            NGINX_BASE=docker.io/library/nginx:1.30.4-trixie@sha256:d5792f71a9496b833bc08ea834a758c46e2b6a6306c10f4be926f38a656cdc1c
            FRANKENPHP_BASE=${{ matrix.base }}
            PHP_BRANCH=${{ matrix.php }}
          tags: |
            ${{ env.COMMUNITY_ALPHA != 'true' && format('{0}:{1}', env.IMAGE, matrix.php) || '' }}
            ${{ env.IMAGE }}:${{ matrix.php }}-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/magelift/magelift
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=MageLift ${{ matrix.image }} PHP ${{ matrix.php }}
          sbom: ${{ github.event_name == 'push' || inputs.publish }}
          provenance: ${{ (github.event_name == 'push' || inputs.publish) && 'mode=max' || 'false' }}
      - name: Check PHP and builder tools
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          PHP_BRANCH: ${{ matrix.php }}
          IMAGE_KIND: ${{ matrix.image }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          image_ref="${IMAGE}:${PHP_BRANCH}-${VERSION}"
          if [[ "$PUBLISH" == true ]]; then image_ref="${IMAGE}@${IMAGE_DIGEST}"; fi
          docker run --rm --platform linux/amd64 --entrypoint php \
            -e MAGELIFT_EXPECTED_PHP="$PHP_BRANCH" "$image_ref" -r '
            if (!str_starts_with(PHP_VERSION, getenv("MAGELIFT_EXPECTED_PHP") . ".")) { exit(1); }
            foreach (["bcmath", "dom", "gd", "intl", "pdo_mysql", "soap", "sodium", "xsl", "zip", "redis", "apcu"] as $extension) {
              if (!extension_loaded($extension)) { fwrite(STDERR, "Missing extension: " . $extension . PHP_EOL); exit(1); }
            }
            echo PHP_VERSION, PHP_EOL;'
          if [[ "$IMAGE_KIND" == builder ]]; then
            docker run --rm --platform linux/amd64 --entrypoint composer "$image_ref" --version
          fi
      - if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign published digest
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Verify published digest
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: >-
          cosign verify
          --certificate-identity "$SIGNING_IDENTITY"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Publish registry provenance attestation
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify anonymous access to published digest
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull --platform linux/amd64 "${IMAGE}@${IMAGE_DIGEST}"

  community-alpha:
    name: Community alpha ${{ matrix.image }} PHP 8.5 (Linux amd64)
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/images/community-alpha.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:adde18b67ea7a8cddc580f657e0d3f16e800758c6fa690b969c2925a303e8afc
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:adde18b67ea7a8cddc580f657e0d3f16e800758c6fa690b969c2925a303e8afc
    env:
      IMAGE: ghcr.io/magelift/magelift-${{ matrix.image }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('v0.0.0-community.{0}', github.sha) }}
      COMMUNITY_ALPHA: 'true'
      SIGNING_IDENTITY: https://github.com/${{ github.workflow_ref }}
    steps: *image-steps
