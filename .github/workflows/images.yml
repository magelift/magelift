name: Validate Container Recipes

# MageLift ships recipes. Users build and publish images in their own CI/registry.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PHP 8.5 ${{ matrix.target }} (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [builder, runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0
      - name: Build recipe without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/php-nginx/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          tags: magelift-validation:${{ matrix.target }}
          push: false
          load: true
          provenance: false
          sbom: false
      - name: Check PHP recipe
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm --entrypoint php "magelift-validation:${TARGET}" -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 5) { exit(1); }'
