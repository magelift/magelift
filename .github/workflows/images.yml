name: Release Container Images

# Stable semver tags only (no hyphen prerelease). Four failing v1.0.0-rc.1
# retries burned ~750 job-minutes on a 12× multi-arch matrix. To publish an
# RC image matrix, temporarily drop the job `if` or retag without '-'.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  publish:
    name: ${{ matrix.image }} PHP ${{ matrix.php }}
    # Skip prerelease tags (semver uses '-' for -rc / -alpha / -beta).
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: runtime
            file: images/php-runtime/Dockerfile
            target: runtime
            php: '8.2'
            base: docker.io/library/php:8.2-fpm-trixie@sha256:250c82f606f926bdbcc2baa83b2e6becf7ffec9944b9e6d308177274084e4321
          - image: runtime
            file: images/php-runtime/Dockerfile
            target: runtime
            php: '8.3'
            base: docker.io/library/php:8.3-fpm-trixie@sha256:4202966c9c1e2dc5416c845ec69617fd734c186f4acd31089a1dd5fa2218648d
          - image: runtime
            file: images/php-runtime/Dockerfile
            target: runtime
            php: '8.4'
            base: docker.io/library/php:8.4-fpm-trixie@sha256:a77f5f0ee8df9035f2a90d4f713e253bc374ed27534a30e5889e50e9346c5232
          - image: runtime
            file: images/php-runtime/Dockerfile
            target: runtime
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:f56f4a81de6cd33ddfd6e99352889a53c94c3ffccce89e494563845a1c8ba75a
          - image: builder
            file: images/php-runtime/Dockerfile
            target: builder
            php: '8.2'
            base: docker.io/library/php:8.2-fpm-trixie@sha256:250c82f606f926bdbcc2baa83b2e6becf7ffec9944b9e6d308177274084e4321
          - image: builder
            file: images/php-runtime/Dockerfile
            target: builder
            php: '8.3'
            base: docker.io/library/php:8.3-fpm-trixie@sha256:4202966c9c1e2dc5416c845ec69617fd734c186f4acd31089a1dd5fa2218648d
          - image: builder
            file: images/php-runtime/Dockerfile
            target: builder
            php: '8.4'
            base: docker.io/library/php:8.4-fpm-trixie@sha256:a77f5f0ee8df9035f2a90d4f713e253bc374ed27534a30e5889e50e9346c5232
          - image: builder
            file: images/php-runtime/Dockerfile
            target: builder
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:f56f4a81de6cd33ddfd6e99352889a53c94c3ffccce89e494563845a1c8ba75a
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.2'
            base: docker.io/dunglas/frankenphp:1.12.6-php8.2-trixie@sha256:f6b639e0c1445db0a08b2558b9fbf9d86d8b89eaaad734554c1fbd3854266672
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.3'
            base: docker.io/dunglas/frankenphp:1.12.6-php8.3-trixie@sha256:032d1d77d88076d0290cb8d3d22e5645e8cd33b970644304c59a7a35d5218b93
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.4'
            base: docker.io/dunglas/frankenphp:1.12.6-php8.4-trixie@sha256:d341f89bf44ff1d867cd6b9dc88a7a2942741cdddfbf92543ddf7e65c29f3412
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.5'
            base: docker.io/dunglas/frankenphp:1.12.6-php8.5-trixie@sha256:f090c8edf61410f04f3e8533c7bc4896de68be0d363c8c70be200f2c17fab232

    env:
      IMAGE: ghcr.io/magelift/magelift-${{ matrix.image }}
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_BASE=${{ matrix.base }}
            NGINX_BASE=docker.io/library/nginx:1.30.4-trixie@sha256:5cf90903deda2c5981b8ad05e7617ac010e389f0dde0ac83487c02c509281de6
            FRANKENPHP_BASE=${{ matrix.base }}
            PHP_BRANCH=${{ matrix.php }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.php }}
            ${{ env.IMAGE }}:${{ matrix.php }}-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/magelift/magelift
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=MageLift ${{ matrix.image }} PHP ${{ matrix.php }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (cosign 3.0.6)
      - name: Sign published digest
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Verify published digest
        run: >-
          cosign verify
          --certificate-identity "https://github.com/magelift/magelift/.github/workflows/images.yml@refs/tags/${VERSION}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Publish registry provenance attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
