name: Release Container Images

# Stable semver tags only (no hyphen prerelease). A 12x multi-arch RC
# matrix costs ~750 job-minutes per attempt, so RC images stay manual:
# to publish an RC image matrix, temporarily drop the job `if` or retag
# without '-'.
on:
  push:
    # `sdk/v*` module tags never match: `v*` anchors at the start of the ref name.
    tags: ['v*']

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  publish:
    name: ${{ matrix.image }} PHP ${{ matrix.php }}
    # Skip prerelease tags (semver uses '-' for -rc / -alpha / -beta).
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.2'
            base: docker.io/library/php:8.2-fpm-trixie@sha256:596175799ca76a93d5d0c3cda7d5f70fccfc86dfdaf97580c1c27e665aba991f
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.3'
            base: docker.io/library/php:8.3-fpm-trixie@sha256:5ad27201cf5cdf1704e147218e64fa0db2155ecda26edbe2b3eeb7b90cbf9328
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.4'
            base: docker.io/library/php:8.4-fpm-trixie@sha256:59fa733c9af643a122f8a9976119460e35ce76dd0a3f2b9c8f75af8e361a54e2
          - image: nginx
            file: images/php-nginx/Dockerfile
            target: runtime
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:70076c1cae0cd0ba6761832417e3a1df3e5560f0544eb0fe40357373e54420fe
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.2'
            base: docker.io/library/php:8.2-fpm-trixie@sha256:596175799ca76a93d5d0c3cda7d5f70fccfc86dfdaf97580c1c27e665aba991f
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.3'
            base: docker.io/library/php:8.3-fpm-trixie@sha256:5ad27201cf5cdf1704e147218e64fa0db2155ecda26edbe2b3eeb7b90cbf9328
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.4'
            base: docker.io/library/php:8.4-fpm-trixie@sha256:59fa733c9af643a122f8a9976119460e35ce76dd0a3f2b9c8f75af8e361a54e2
          - image: builder
            file: images/php-nginx/Dockerfile
            target: builder
            php: '8.5'
            base: docker.io/library/php:8.5-fpm-trixie@sha256:70076c1cae0cd0ba6761832417e3a1df3e5560f0544eb0fe40357373e54420fe
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.2'
            base: docker.io/dunglas/frankenphp:1.12.7-php8.2-trixie@sha256:3c1ad970186bc0d3b47d0ff3212f9f47dfa0e6c7e5dbb68bec19ed9c6464c466
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.3'
            base: docker.io/dunglas/frankenphp:1.12.7-php8.3-trixie@sha256:b0029775078a8434f74f7c694e0634e4a8e1a81b758132b22baaf42110a176b4
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.4'
            base: docker.io/dunglas/frankenphp:1.12.7-php8.4-trixie@sha256:77bc2d40a58ace3a9425e4cbb0c40d044188dfd850e44a943ed043d743625df3
          - image: frankenphp-classic
            file: images/frankenphp-classic/Dockerfile
            target: ''
            php: '8.5'
            base: docker.io/dunglas/frankenphp:1.12.7-php8.5-trixie@sha256:f92d81eb3fe4fd18b35d3d58192b7cc3acc8943817bbf39f2fcf0be02a3916dc

    env:
      IMAGE: ghcr.io/magelift/magelift-${{ matrix.image }}
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_BASE=${{ matrix.base }}
            NGINX_BASE=docker.io/library/nginx:1.30.4-trixie@sha256:d5792f71a9496b833bc08ea834a758c46e2b6a6306c10f4be926f38a656cdc1c
            FRANKENPHP_BASE=${{ matrix.base }}
            PHP_BRANCH=${{ matrix.php }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.php }}
            ${{ env.IMAGE }}:${{ matrix.php }}-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/magelift/magelift
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=MageLift ${{ matrix.image }} PHP ${{ matrix.php }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign published digest
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Verify published digest
        run: >-
          cosign verify
          --certificate-identity "https://github.com/magelift/magelift/.github/workflows/images.yml@refs/tags/${VERSION}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Publish registry provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
