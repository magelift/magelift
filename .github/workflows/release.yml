name: Release Artifacts

on:
  push:
    # `sdk/v*` module tags never match: `v*` anchors at the start of the ref name.
    tags: ['v*']

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Twelve Pulumi-heavy cross-compiles; warm caches carry the
    # repeat-release case. No parallelism or GOMAXPROCS caps: the old
    # serialism was measured on small private runners, not hosted ones.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Warm Go caches (shared with CI's go-prime keys): repeat releases
      # recompile only MageLift packages instead of the Pulumi world.
      # Explicit save: the post step never runs when the job fails late.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-prime-${{ runner.os }}-${{ hashFiles('go.sum', 'sdk/go.sum', 'providers/gcp/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-prime-${{ runner.os }}-${{ hashFiles('go.sum', 'sdk/go.sum', 'providers/gcp/go.sum', 'go.work.sum') }}-
            go-prime-${{ runner.os }}-
          lookup-only: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # GoReleaser's SBOM cataloging shells out to syft; without it the
      # release fails after the builds (seen on v0.0.0-dialproof.3).
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # Module tags need proxy plus sumdb visibility before packaging:
      # workspace builds still verify requirement .mod files over the
      # network on cold caches, and a fresh tag 404s for minutes (seen
      # on rc.3/rc.4). Two consecutive downloads prove the entries are
      # serveable and stable, not flapping into view.
      - name: Wait for module visibility
        if: "!startsWith(github.ref_name, 'v0.0.0-dialproof')"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GOWORK: "off"
        run: |
          deadline=$((SECONDS + 1800))
          for module in "github.com/magelift/magelift" "github.com/magelift/magelift/sdk" "github.com/magelift/magelift/providers/gcp"; do
            stable=0
            while [[ "$stable" -lt 2 ]]; do
              # go mod download, not go list: packaging needs the zip plus
              # both sumdb entries, and the .mod alone can go visible first.
              if go mod download "$module@$RELEASE_TAG" >/dev/null 2>&1; then
                stable=$((stable + 1))
              else
                stable=0
              fi
              if [[ "$SECONDS" -ge "$deadline" ]]; then
                echo "module $module@$RELEASE_TAG never became visible" >&2
                exit 1
              fi
              [[ "$stable" -lt 2 ]] && sleep 60
            done
          done
      # Forensics: workspace resolution is what keeps tag builds local;
      # print it so the next visibility failure starts from evidence.
      - name: Show module resolution
        run: |
          go env GOWORK
          go list -m -f '{{.Path}} {{.Version}} {{.Dir}}' github.com/magelift/magelift
        working-directory: providers/gcp
      # Ephemeral dialproof tags take the slim linux/amd64 config (no SBOM,
      # taps, or attest): same signs/checksum/archive shape, ~5 min, so the
      # bundle/lockfile debug loop does not pay the 2h full matrix.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: startsWith(github.ref_name, 'v0.0.0-dialproof')
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean --timeout 30m -f .goreleaser.dialproof.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: "!startsWith(github.ref_name, 'v0.0.0-dialproof')"
        with:
          distribution: goreleaser
          version: v2.18.1
          # Default parallelism and GOMAXPROCS: GoReleaser and the Go
          # toolchain size themselves to the runner. Timeout 150m stays
          # a safe upper bound.
          args: release --clean --timeout 150m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the brew formula and Scoop manifest to their tap repos.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # OOM guardrail only (the historical private-runner failure);
          # 12GiB never binds a healthy link on the 16GB box.
          GOMEMLIMIT: 12GiB
      # The CLI verifies a provider binary against the digest plus
      # Cosign bundle named in magelift.providers.lock. One lock per
      # platform (the installed binary has a fixed name); digests come
      # from the checksums GoReleaser just signed.
      - name: Generate provider lockfiles
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go run ./cmd/genproviders --tag "$RELEASE_TAG" --dist dist
      - name: Upload provider lockfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/magelift.providers.lock.* --clobber
      - name: Verify provider bundles
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import json, subprocess, sys
          tag = sys.argv[1]
          identity = f"https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/{tag}"
          issuer = "https://token.actions.githubusercontent.com"
          checksums = {}
          with open("dist/checksums.txt") as f:
              for line in f:
                  parts = line.split()
                  if len(parts) == 2:
                      checksums[parts[1]] = parts[0]
          with open("dist/artifacts.json") as f:
              artifacts = json.load(f)
          paths = {}
          for artifact in artifacts:
              if artifact.get("type") in ("Binary", "Signature"):
                  paths[artifact["name"]] = artifact["path"]
          verified = 0
          for asset in sorted(checksums):
              if not asset.startswith("magelift-provider-"):
                  continue
              if asset.endswith(".sigstore.json") or asset.endswith(".sbom.json"):
                  continue
              bundle = asset + ".sigstore.json"
              if asset not in paths or bundle not in paths:
                  print(f"missing binary or bundle for {asset}", file=sys.stderr)
                  sys.exit(1)
              subprocess.run(
                  ["cosign", "verify-blob",
                   "--bundle", paths[bundle],
                   "--certificate-identity", identity,
                   "--certificate-oidc-issuer", issuer,
                   paths[asset]],
                  check=True,
              )
              verified += 1
          if verified == 0:
              print("no provider bundles verified", file=sys.stderr)
              sys.exit(1)
          print(f"verified {verified} provider bundles")
          PY
      - name: Verify signed checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          cosign verify-blob
          --bundle dist/checksums.txt.sigstore.json
          --certificate-identity
          "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: "!startsWith(github.ref_name, 'v0.0.0-dialproof')"
        with:
          subject-checksums: dist/checksums.txt
      # Pristine consumer proof: the published modules resolve and
      # compile exactly as tagged, without manifest edits. @version
      # installs ignore the checkout and build from the proxy with
      # sumdb verification; the release fails before publish otherwise.
      - name: Verify published modules
        if: "!startsWith(github.ref_name, 'v0.0.0-dialproof')"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GOWORK: "off"
        run: |
          go install "github.com/magelift/magelift/cmd/magelift@${RELEASE_TAG}"
          go install "github.com/magelift/magelift/providers/gcp/cmd/magelift-provider-gcp@${RELEASE_TAG}"
          work="$(mktemp -d)"
          cd "$work"
          go mod init magelift-sdk-verify >/dev/null
          go mod edit "-require=github.com/magelift/magelift/sdk@${RELEASE_TAG}"
          printf 'package main\nimport _ "github.com/magelift/magelift/sdk"\nfunc main() {}\n' > main.go
          GOWORK=off go mod tidy
          GOWORK=off go build -o /dev/null .
      # The release stays draft until every verification above passes.
      # Lockfiles upload outside the signed checksum set by construction
      # (bundles postdate checksums); their authentication policy is the
      # pinned-publisher design: the CLI refuses lockfiles whose
      # identity/issuer differ from the release workflow pin, and content
      # trust stays digest plus bundle-over-pinned-identity.
      - name: Publish the verified candidate
        if: "!startsWith(github.ref_name, 'v0.0.0-dialproof')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          bash scripts/release-checks-gate.sh --sha "$SHA" --exclude-run "$GITHUB_RUN_ID"
          gh release edit "$RELEASE_TAG" --draft=false
      # Explicit save with if: always() — setup-go's post-step never runs
      # when the job fails, and the next candidate wants this build cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-prime-${{ runner.os }}-${{ hashFiles('go.sum', 'sdk/go.sum', 'providers/gcp/go.sum', 'go.work.sum') }}-${{ github.sha }}
  # The cask publishes to the tap during release; this job is the tested
  # macOS install path the readiness doc requires. A failure fails the
  # workflow visibly so the tap file gets fixed forward the same day.
  # Dialproof tags publish no tap, so there is nothing to verify.
  cask-verify:
    if: "!startsWith(github.ref_name, 'v0.0.0-dialproof')"
    needs: [release]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
             - name: Install the published cask
               run: |
                 brew tap magelift/homebrew-tap
                 brew trust magelift/tap
                 brew install --cask magelift
                 magelift version
