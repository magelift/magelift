name: Release Artifacts

on:
  push:
    tags: ['v*']

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Six cross-compiles of the Pulumi-heavy binary need wall time; keep under
    # the hosted-runner kill window by serializing (see --parallelism 1).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # GoReleaser's SBOM cataloging shells out to syft; without it the
      # release fails after the builds (seen on v0.0.0-dialproof.3).
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          # Parallelism 1: private 7 GB runners lose communication under
          # concurrent Pulumi-graph cross-compiles (seen on v1.0.0-rc.1).
          # Timeout 150m: twelve serial Pulumi-heavy cross-compiles exceed
          # GoReleaser's default 1h; the job allows 180 minutes.
          args: release --clean --parallelism 1 --timeout 150m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the brew formula and Scoop manifest to their tap repos.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GOMAXPROCS: "1"
      - name: Verify signed checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          cosign verify-blob
          --bundle dist/checksums.txt.sigstore.json
          --certificate-identity
          "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
  # The cask publishes to the tap during release; this job is the tested
  # macOS install path the readiness doc requires. A failure fails the
  # workflow visibly so the tap file gets fixed forward the same day.
  cask-verify:
    needs: [release]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
             - name: Install the published cask
               run: |
                 brew tap magelift/homebrew-tap
                 brew trust magelift/tap
                 brew install --cask magelift
                 magelift version
