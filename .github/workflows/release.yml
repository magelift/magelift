name: Release Artifacts

on:
  push:
    tags: ['v*']

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Six cross-compiles of the Pulumi-heavy binary need wall time; keep under
    # the hosted-runner kill window by serializing (see --parallelism 1).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # GoReleaser's SBOM cataloging shells out to syft; without it the
      # release fails after the builds (seen on v0.0.0-dialproof.3).
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          # Parallelism 1: private 7 GB runners lose communication under
          # concurrent Pulumi-graph cross-compiles (seen on v1.0.0-rc.1).
          # Timeout 150m: twelve serial Pulumi-heavy cross-compiles exceed
          # GoReleaser's default 1h; the job allows 180 minutes.
          args: release --clean --parallelism 1 --timeout 150m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the brew formula and Scoop manifest to their tap repos.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GOMAXPROCS: "1"
      # The CLI verifies a provider binary against the digest plus
      # Cosign bundle named in magelift.providers.lock. One lock per
      # platform (the installed binary has a fixed name); digests come
      # from the checksums GoReleaser just signed.
      - name: Generate provider lockfiles
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import hashlib, json, os, sys
          tag = sys.argv[1]
          identity = f"https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/{tag}"
          issuer = "https://token.actions.githubusercontent.com"
          checksums = {}
          with open("dist/checksums.txt") as f:
              for line in f:
                  parts = line.split()
                  if len(parts) == 2:
                      checksums[parts[1]] = parts[0]
          providers = {}
          for asset, digest in sorted(checksums.items()):
              if not asset.startswith("magelift-provider-"):
                  continue
              if asset.endswith(".sigstore.json") or asset.endswith(".sbom.json"):
                  continue
              # magelift-provider-gcp_<version>_<os>_<arch>[.exe]
              rest = asset[len("magelift-provider-"):]
              name, _, tail = rest.partition("_")
              _version, _, platform = tail.partition("_")
              platform = platform.removesuffix(".exe")
              bundle = asset + ".sigstore.json"
              # Bundles are signed after checksums run, so they are
              # not in checksums.txt; they must exist in dist/.
              if not os.path.exists(f"dist/{bundle}"):
                  print(f"missing bundle for {asset}", file=sys.stderr)
                  sys.exit(1)
              providers.setdefault(platform, {})[name] = {
                  "name": f"magelift-provider-{name}",
                  "version": tag,
                  "digest": f"sha256:{digest}",
                  "cosign": {"identity": identity, "issuer": issuer, "bundle": bundle},
              }
          for platform, entries in sorted(providers.items()):
              lock = {"schemaVersion": 1, "sdkAPIVersion": "v1", "providers": entries}
              path = f"dist/magelift.providers.lock.{platform}"
              with open(path, "w") as f:
                  json.dump(lock, f, indent=2)
                  f.write("\n")
              print(f"wrote {path}")
          PY
      - name: Upload provider lockfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/magelift.providers.lock.* --clobber
      - name: Verify provider bundles
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for bin in dist/magelift-provider-*; do
            case "$bin" in *.sigstore.json|*.sbom.json) continue;; esac
            cosign verify-blob \
              --bundle "$bin.sigstore.json" \
              --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$bin"
          done
      - name: Verify signed checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          cosign verify-blob
          --bundle dist/checksums.txt.sigstore.json
          --certificate-identity
          "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
  # The cask publishes to the tap during release; this job is the tested
  # macOS install path the readiness doc requires. A failure fails the
  # workflow visibly so the tap file gets fixed forward the same day.
  cask-verify:
    needs: [release]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
             - name: Install the published cask
               run: |
                 brew tap magelift/homebrew-tap
                 brew trust magelift/tap
                 brew install --cask magelift
                 magelift version
