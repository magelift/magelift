name: Release Artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Six cross-compiles of the Pulumi-heavy binary need wall time; keep under
    # the hosted-runner kill window by serializing (see --parallelism 1).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (cosign 3.0.6)
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          # Parallelism 1: private 7 GB runners lose communication under
          # concurrent Pulumi-graph cross-compiles (seen on v1.0.0-rc.1).
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOMAXPROCS: "1"
      - name: Verify signed checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          cosign verify-blob
          --bundle dist/checksums.txt.sigstore.json
          --certificate-identity
          "https://github.com/acourtiol/magelift/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          dist/checksums.txt
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/checksums.txt
