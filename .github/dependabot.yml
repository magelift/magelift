version: 2
updates:
  # Each Go module is its own directory. sdk/go.mod has no third-party
  # requirements, so it is not listed. The seven-day cooldown is the
  # minimum the Actions Security workflow accepts.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencies, go]
    commit-message:
      prefix: chore
      include: scope
    groups:
      pulumi:
        patterns:
          - "github.com/pulumi/*"
          - "github.com/pulumiverse/*"
          - "github.com/ovh/pulumi-*"
      aws-sdk:
        patterns:
          - "github.com/aws/*"
      google-cloud:
        patterns:
          - "cloud.google.com/*"
          - "google.golang.org/*"
      azure-sdk:
        patterns: ["github.com/Azure/*"]
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: ["/providers/gcp", "/providers/azure"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencies, go]
    commit-message:
      prefix: chore
      include: scope
    groups:
      pulumi:
        patterns:
          - "github.com/pulumi/*"
      google-cloud:
        patterns:
          - "cloud.google.com/*"
          - "google.golang.org/*"
      azure-sdk:
        patterns: ["github.com/Azure/*"]
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: composer
    directory: /build
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: [dependencies, php]
    commit-message:
      prefix: chore
      include: scope
    groups:
      composer-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
  # Example workflows have their own .github/workflows directories.
  - package-ecosystem: github-actions
    directories: ["/examples", "/examples/sample-shop"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
      include: scope
  # Root Compose files use pinned emulator images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope
  # Dependabot accepts one directory per Docker entry.
  - package-ecosystem: docker
    directory: /images/php-nginx
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /images/php-apache
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /images/frankenphp-classic
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope
