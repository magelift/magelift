name: Feature request
description: Propose a capability, provider improvement, or CLI change
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a new cloud or runtime, name the target and the first shop workflow
        you want to run. Discuss a large provider change here before opening a PR.
        [Provider guide](https://github.com/magelift/magelift/blob/main/docs/adding-a-provider.md)
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should MageLift do? For a new cloud, include the service choices and the first deployment or operation to test.
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Affected area
      options:
        - CLI or documentation
        - AWS provider
        - Google Cloud provider
        - Azure provider
        - New cloud provider or runtime
        - Community / custom binary
        - Unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Escape hatches, existing config fields, or why a new API is needed.
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints you accept
      options:
        - label: Keep shop configuration in magelift.php
        - label: Keep cloud topology in the provider module
        - label: Preserve compatibility, environment protection and secret handling
